name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The browser tests take about nine minutes on a developer machine since the width, headline, and page-database tests
    # were added (2026-11-13). The limit leaves room for a slower machine; a run that hangs still ends.
    timeout-minutes: 25
    steps:
      # Actions are pinned by commit hash so that a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (exact versions, no install scripts)
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Boundaries
        run: npm run boundaries
      - name: Unit tests
        run: npm test
      - name: Licence notices are current
        run: node scripts/make-notices.mjs --check
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the page, checks its size, drives it in a browser)
        run: npm run e2e
      - name: Dependency audit
        run: npm run audit:deps
